name: Verify downloadable Evolution Arena package
on:
  push:
    branches: [evolution-download]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2f9986474778fabcfac39931368bb5ca29d79e79
          fetch-depth: 0
      - name: Test the current rules with undefined behavior checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev
          g++ -std=c++17 -Wall -Wextra -pedantic -fsanitize=undefined -fno-sanitize-recover=all test/evolution/RunTests.cpp -o "$RUNNER_TEMP/evolution-tests"
          "$RUNNER_TEMP/evolution-tests"
          python3 test/evolution/test_catalog.py
      - name: Select a matching Windows build
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=$(git rev-parse HEAD)
          # The Windows compiler can still be running when this audit starts.
          for attempt in $(seq 1 90); do
            gh api "repos/$GH_REPO/actions/workflows/evolution-windows.yml/runs?branch=evolution-arena&event=push&per_page=12" --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' > "$RUNNER_TEMP/candidates"
            while read -r run sha; do
              git cat-file -e "$sha^{commit}" 2>/dev/null || continue
              git diff --quiet "$sha" "$target" -- . ':(exclude).github/workflows' || continue
              conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "build") | .conclusion')
              [[ "$conclusion" == success ]] || continue
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            done < "$RUNNER_TEMP/candidates"
            sleep 40
          done
          echo "Timed out waiting for a successful Windows build matching $target"
          exit 1
    outputs:
      run: ${{ steps.select.outputs.run }}
      sha: ${{ steps.select.outputs.sha }}
  portable:
    needs: rules
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download a successful Evolution Arena build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $run = gh api "repos/$env:GH_REPO/actions/runs/${{ needs.rules.outputs.run }}" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_sha -ne '${{ needs.rules.outputs.sha }}') { throw 'Selected build does not match the tested source' }
          gh run download $run.id -n EvolutionArena-Windows-x64 -D artifact
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath artifact/EvolutionArena-Windows-x64.zip -DestinationPath game
          "Validated source $($run.head_sha) from [this build]($($run.html_url))." >> $env:GITHUB_STEP_SUMMARY
      - name: Inspect package and launch the shipped Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location game
          $required = 'VCMI_client.exe','VCMI_server.exe','VCMI_launcher.exe','Mods/arenabattles/Content/config/evolution.json','config/dirs.json','EVOLUTION-RU.md'
          foreach ($name in $required) {
            if (!(Test-Path -LiteralPath $name -PathType Leaf)) { throw "Missing $name" }
          }
          $catalog = Get-Content Mods/arenabattles/Content/config/evolution.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($name in 'ossuary','nursery','kinship','underdog','wait','forge','acid') {
            if (!$catalog.mutations.$name) { throw "Missing mutation $name" }
          }
          if ($catalog.synergies.Count -lt 9) { throw 'Missing squad combinations' }
          $legacy = Get-ChildItem -Recurse -File | Where-Object Extension -in '.lod','.snd','.vid'
          if ($legacy) { throw "Unexpected legacy game archive: $($legacy.Name)" }
          $profile = (Get-Content config/dirs.json -Raw | ConvertFrom-Json).userDataPath
          if ($profile -ne '%LOCALAPPDATA%/EvolutionArena') { throw 'Unexpected profile destination' }
          foreach ($name in 'VCMI_client.exe','VCMI_server.exe') {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $name))
            $offset = [BitConverter]::ToInt32($bytes,60)
            if ([BitConverter]::ToUInt16($bytes,$offset+4) -ne 0x8664) { throw "$name is not an x64 binary" }
            $proc = Start-Process -FilePath (Resolve-Path $name) -ArgumentList '--version' -PassThru -WindowStyle Hidden
            if (!$proc.WaitForExit(30000)) { $proc.Kill(); throw "$name --version timed out" }
            if ($proc.ExitCode -ne 0) { throw "$name --version returned $($proc.ExitCode)" }
            Write-Host "$name --version exited successfully."
          }

  rarity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 2f9986474778fabcfac39931368bb5ca29d79e79
          path: gameplay
      - run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev
      - run: g++ -std=c++17 -I gameplay test/evolution/RarityDistribution.cpp -o "$RUNNER_TEMP/rarity" && "$RUNNER_TEMP/rarity"
