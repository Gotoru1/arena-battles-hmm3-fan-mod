name: Verify downloadable Evolution Arena package
on:
  push:
    branches: [evolution-download]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download a successful Evolution Arena build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $runs = gh api "repos/$env:GH_REPO/actions/workflows/evolution-windows.yml/runs?branch=evolution-arena&event=push&status=success&per_page=1" | ConvertFrom-Json
          if ($LASTEXITCODE -or !$runs.workflow_runs) { throw 'No successful builds' }
          $run = $runs.workflow_runs[0]
          gh run download $run.id -n EvolutionArena-Windows-x64 -D artifact
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath artifact/EvolutionArena-Windows-x64.zip -DestinationPath game
          "Validated source $($run.head_sha) from [this build]($($run.html_url))." >> $env:GITHUB_STEP_SUMMARY
      - name: Inspect package and launch the shipped Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location game
          $required = 'VCMI_client.exe','VCMI_server.exe','VCMI_launcher.exe','Mods/arenabattles/Content/config/evolution.json','config/dirs.json','EVOLUTION-RU.md'
          foreach ($name in $required) {
            if (!(Test-Path -LiteralPath $name -PathType Leaf)) { throw "Missing $name" }
          }
          $legacy = Get-ChildItem -Recurse -File | Where-Object Extension -in '.lod','.snd','.vid'
          if ($legacy) { throw "Unexpected legacy game archive: $($legacy.Name)" }
          $profile = (Get-Content config/dirs.json -Raw | ConvertFrom-Json).userDataPath
          if ($profile -ne '%LOCALAPPDATA%/EvolutionArena') { throw 'Unexpected profile destination' }
          foreach ($name in 'VCMI_client.exe','VCMI_server.exe') {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $name))
            $offset = [BitConverter]::ToInt32($bytes,60)
            if ([BitConverter]::ToUInt16($bytes,$offset+4) -ne 0x8664) { throw "$name is not an x64 binary" }
            $proc = Start-Process -FilePath (Resolve-Path $name) -ArgumentList '--version' -PassThru -WindowStyle Hidden
            if (!$proc.WaitForExit(30000)) { $proc.Kill(); throw "$name --version timed out" }
            if ($proc.ExitCode -ne 0) { throw "$name --version returned $($proc.ExitCode)" }
            Write-Host "$name --version exited successfully."
          }
