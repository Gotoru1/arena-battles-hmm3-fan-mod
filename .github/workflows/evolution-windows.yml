name: Evolution Arena Windows
on:
  push:
    branches: [evolution-arena, evolution-arena-2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evolution-vertical-slice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify mutation catalog and battle reactions
        run: |
          python3 test/evolution/test_catalog.py
          g++ -std=c++17 -Wall -Wextra -pedantic -fsanitize=undefined -fno-sanitize-recover=all test/evolution/BattleReactionsTests.cpp -o "$RUNNER_TEMP/reaction-tests"
          "$RUNNER_TEMP/reaction-tests"
      - name: Install Boost headers
        shell: bash
        run: |
          if [ ! -f /usr/include/boost/multiprecision/cpp_int.hpp ]; then
            curl --fail --location --retry 3 https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2 -o "$RUNNER_TEMP/boost.tar.bz2"
            tar -xjf "$RUNNER_TEMP/boost.tar.bz2" -C "$RUNNER_TEMP" boost_1_86_0/boost
            echo "CPLUS_INCLUDE_PATH=$RUNNER_TEMP/boost_1_86_0" >> "$GITHUB_ENV"
          fi
      - name: Compile and run deterministic run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -fsanitize=undefined -fno-sanitize-recover=all test/evolution/RunTests.cpp -o "$RUNNER_TEMP/evolution-tests"
          "$RUNNER_TEMP/evolution-tests"
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: evolution-msvc-x64
          max-size: 3G
      - name: Restore upstream Conan packages
        shell: bash
        run: |
          set -euo pipefail
          pipx install conan
          source CI/install_conan_dependencies.sh dependencies-windows-x64
          conan profile detect
          conan install . --output-folder=conan-generated --build=never --profile=dependencies/conan_profiles/msvc-x64 --conf="tools.cmake.cmaketoolchain:generator=Ninja" -s "&:build_type=RelWithDebInfo" -c tools.env.virtualenv:powershell=pwsh -o "&:target_pre_windows10=True" --conf="tools.microsoft.msbuild:vs_version=18"
      - name: Verify mutation catalog
        run: python test/evolution/test_catalog.py
      - name: Compile, test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./conan-generated/conanrun.ps1
          cmake --preset windows-msvc-ninja-release -DENABLE_EDITOR=OFF -DENABLE_EVOLUTION_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-ninja-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location out/build/windows-msvc-ninja-release
          ctest -R Evolution --no-tests=error --output-on-failure -C RelWithDebInfo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cpack -C RelWithDebInfo -G ZIP -D CPACK_PACKAGE_FILE_NAME=EvolutionArena-Windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
      - name: Smoke test packaged Windows executables
        shell: pwsh
        run: |
          $archive = 'out/build/windows-msvc-ninja-release/EvolutionArena-Windows-x64.zip'
          $game = Join-Path $env:RUNNER_TEMP 'evolution-portable'
          Expand-Archive -LiteralPath $archive -DestinationPath $game
          foreach ($binary in 'VCMI_client.exe','VCMI_server.exe') {
            $proc = Start-Process -FilePath (Join-Path $game $binary) -WorkingDirectory $game -ArgumentList '--version' -WindowStyle Hidden -PassThru
            if (!$proc.WaitForExit(30000)) { $proc.Kill(); throw "$binary timed out" }
            if ($proc.ExitCode -ne 0) { throw "$binary returned $($proc.ExitCode)" }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: EvolutionArena-Windows-x64
          path: out/build/windows-msvc-ninja-release/EvolutionArena-Windows-x64.zip
          if-no-files-found: error
